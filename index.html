<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Де знайти проектор</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --brand:#08473a;--brand-dark:#053028;--brand-mid:#0d6b56;
  --brand-light:#e8f3f0;--brand-pale:#f2f8f6;--accent:#2ab38a;
  --text-on-brand:#d4efe7;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Nunito',system-ui,sans-serif;background:#f5f5f5;color:#111;min-height:100vh;padding-bottom:3rem}

/* HEADER */
.header{background:var(--brand);padding:2rem 1.25rem 1.5rem;text-align:center}
.header-badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:var(--text-on-brand);font-size:10px;letter-spacing:.14em;padding:4px 14px;border-radius:20px;margin-bottom:1rem;text-transform:uppercase;font-weight:600}
.header h1{color:#fff;font-size:clamp(1.3rem,4vw,1.9rem);font-weight:700;line-height:1.25;margin-bottom:.4rem}
.header h1 span{color:#fff}
.header p{color:rgba(255,255,255,.5);font-size:.83rem;max-width:340px;margin:0 auto}
.live-dot{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);font-size:11px;padding:4px 10px;border-radius:12px;margin-top:.9rem}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399}

.main{padding:1rem;max-width:520px;margin:0 auto}

/* STEPS */
.steps-label{font-size:11px;font-weight:700;color:var(--brand-mid);letter-spacing:.08em;text-transform:uppercase;padding:.5rem 0 .75rem;margin-top:.5rem}

.step-num-bar{padding:.5rem 1.1rem;font-size:11px;font-weight:700;color:var(--brand-mid);letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid #e0e0e0}

.step-card{background:#fff;border:1.5px solid #e0e0e0;border-radius:var(--radius);margin-bottom:.75rem;overflow:hidden}

.step-header{display:flex;align-items:center;gap:12px;padding:1rem 1.1rem;border-bottom:1.5px solid #e0e0e0}
.step-num-badge{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-header-texts{flex:1}
.step-header-title{font-size:14px;font-weight:700;color:#111;line-height:1.3}
.step-header-sub{font-size:11px;color:#777;margin-top:2px}

/* Photo slot */
.photo-slot{width:100%;aspect-ratio:4/3;background:#f0f0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;overflow:hidden;border-bottom:1.5px solid #e0e0e0}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.filled .placeholder-content{display:none}
.placeholder-content{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.photo-slot i.ph-icon{font-size:2.2rem;color:#ccc}
.photo-hint{font-size:12px;color:#aaa;text-align:center;padding:0 20px}
.add-photo-btn{font-size:11px;font-weight:700;color:var(--brand-mid);border:1.5px solid var(--brand-light);background:var(--brand-light);border-radius:20px;padding:5px 14px}
input[type=file]{display:none}

.step-body{padding:.9rem 1.1rem 1.1rem}
.step-desc{font-size:13.5px;line-height:1.65;color:#333}
.step-desc b{color:var(--brand-dark)}

/* Connector */
.arrow-down{display:flex;align-items:center;justify-content:center;gap:8px;padding:.1rem 0;color:#bbb;font-size:12px;font-weight:600}
.arrow-down i{font-size:20px;color:var(--brand-light)}

/* Contact */
.contact-label{font-size:11px;font-weight:700;color:var(--brand-mid);letter-spacing:.08em;text-transform:uppercase;padding:.5rem 0 .75rem;margin-top:.75rem}
.contact-card{background:#fff;border:1.5px solid #e0e0e0;border-radius:var(--radius);display:flex;align-items:center;gap:12px;padding:.9rem 1rem;text-decoration:none;transition:background .15s}
.contact-card:hover{background:var(--brand-pale);border-color:var(--brand)}
.contact-icon{width:42px;height:42px;border-radius:var(--radius-sm);background:var(--brand-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-icon i{font-size:21px;color:var(--brand)}
.contact-texts{flex:1}
.contact-title{font-size:13px;font-weight:700;color:#111}
.contact-phone{font-size:15px;font-weight:700;color:var(--brand-mid);margin-top:2px}
.contact-arrow{font-size:20px;color:#bbb}

.footer{text-align:center;padding:1rem;font-size:11px;color:#999;margin-top:.5rem}
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">New Hope Media</div>
  <h1><span>Розташування<br>відеопроектора</span></h1>

</div>

<div class="main">

  <div class="steps-label">Кроки</div>

  <!-- КРОК 1 -->
  <div class="step-card">
    <div class="step-num-bar">1</div>
    <label class="photo-slot" for="file1" id="slot1">
      <div class="placeholder-content">
        <i class="ti ti-camera ph-icon"></i>
        <span class="add-photo-btn">+ Додати фото</span>
      </div>
      <input type="file" id="file1" accept="image/*" onchange="loadPhoto('slot1',this)">
    </label>
  </div>

  <div class="arrow-down"><i class="ti ti-arrow-down"></i></div>

  <!-- КРОК 2 -->
  <div class="step-card">
    <div class="step-num-bar">2</div>
    <label class="photo-slot" for="file2" id="slot2">
      <div class="placeholder-content">
        <i class="ti ti-zoom-in ph-icon"></i>
        <span class="add-photo-btn">+ Додати фото</span>
      </div>
      <input type="file" id="file2" accept="image/*" onchange="loadPhoto('slot2',this)">
    </label>
  </div>

  <div class="arrow-down"><i class="ti ti-arrow-down"></i></div>

  <!-- КРОК 3 -->
  <div class="step-card">
    <div class="step-num-bar">3</div>
    <label class="photo-slot" for="file3" id="slot3">
      <div class="placeholder-content">
        <i class="ti ti-package ph-icon"></i>
        <span class="add-photo-btn">+ Додати фото</span>
      </div>
      <input type="file" id="file3" accept="image/*" onchange="loadPhoto('slot3',this)">
    </label>
  </div>

  <!-- КОНТАКТ -->
  <div class="contact-label">Є питання?</div>
  <a class="contact-card" href="tel:+380637547539">
    <div class="contact-icon"><i class="ti ti-phone"></i></div>
    <div class="contact-texts">
      <div class="contact-title">Відповідальний за медіа</div>
      <div class="contact-phone">063 754 75 39</div>
    </div>
    <i class="ti ti-chevron-right contact-arrow"></i>
  </a>

</div>

<div class="footer">Медіа-служіння · відскануй QR-код на проекторі</div>

<script>
function loadPhoto(slotId, input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const slot = document.getElementById(slotId);
    let img = slot.querySelector('img');
    if (!img) {
      img = document.createElement('img');
      slot.insertBefore(img, slot.firstChild);
    }
    img.src = e.target.result;
    slot.classList.add('filled');
  };
  reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
